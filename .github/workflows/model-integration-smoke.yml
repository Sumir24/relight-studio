name: Relight Studio Model Integration Smoke

on:
  push:
    branches:
      - feature/model-stack-smoke-v2
  pull_request:
    branches:
      - feature/model-lifecycle-v2
    paths:
      - "relight_engine/adapters/**"
      - "scripts/run_model_integration_smoke.py"
      - "requirements-models.txt"
      - ".github/workflows/model-integration-smoke.yml"

permissions:
  contents: read

jobs:
  cpu-checkpoint-smoke:
    name: Python 3.14 — real HF checkpoint inference (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-models.txt

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install neural inference dependencies
        run: python -m pip install -r requirements-models.txt

      - name: Run real checkpoint smoke test
        run: python scripts/run_model_integration_smoke.py

      - name: Upload model smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relight-studio-model-smoke-report
          path: model_smoke_report.json
          if-no-files-found: ignore
