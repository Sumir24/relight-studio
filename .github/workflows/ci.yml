name: Relight Studio CI

on:
  push:
    branches:
      - feature/model-lifecycle-v2
  pull_request:
    branches:
      - feature/geometry-v2-quality-gate

permissions:
  contents: read

jobs:
  test:
    name: Python 3.14 — compile and pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: relight_studio_core/requirements.txt

      - name: Install core dependencies
        working-directory: relight_studio_core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile source and tests
        working-directory: relight_studio_core
        run: python -m compileall -q relight_engine scripts tests

      - name: Run test suite
        working-directory: relight_studio_core
        run: python -m pytest -q
